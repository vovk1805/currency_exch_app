<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="24h buying currencies app" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png?v=11" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=11" />
  <link rel="icon" type="image/png" href="assets/icons/apple-touch-icon-180.png?v=11" />
  <title>24h buying currencies app</title>
  <link rel="stylesheet" href="css/app.css?v=11" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="currency-row" id="currencyRow" role="listbox" aria-label="Валюта"></div>
      <div class="amount-block">
        <label class="amount-label" id="amountLabel" for="amountDisplay">Сума</label>
        <div class="amount-display" id="amountDisplay">0</div>
        <div class="rate-line" id="rateLine">Завантаження курсів…</div>
      </div>
    </header>

    <main class="panes">
      <section class="pane pane-fx" aria-label="Іноземна готівка">
        <div class="pane-header">
          <h2 id="fxTitle">Іноземна</h2>
          <p class="pane-summary" id="fxSummary">—</p>
        </div>
        <div class="bills" id="fxBills"></div>
      </section>
      <section class="pane pane-uah" aria-label="До сплати в UAH">
        <div class="pane-header">
          <h2 id="uahTitle">До сплати в UAH</h2>
          <p class="pane-summary" id="uahSummary">—</p>
          <p class="pane-discount" id="discountLine" hidden></p>
          <p class="pane-final" id="finalLine" hidden></p>
        </div>
        <div class="bills" id="uahBills"></div>
      </section>
    </main>

    <footer class="footer-bar">
      <div class="keypad" id="keypad" aria-label="Клавіатура">
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-action" data-key="clear">C</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-action" data-key="back">⌫</button>
        <button type="button" class="key key-zero" data-key="0">0</button>
      </div>
      <div class="discount-actions">
        <button type="button" class="discount-btn" id="discountBtn">Застосувати знижку</button>
        <button type="button" class="discount-btn discount-btn-clear lottery-btn" id="lotteryBtn">Скільки знижка</button>
        <button type="button" class="discount-btn discount-btn-clear phone-btn" id="phoneBtn">Номер телефону</button>
        <button type="button" class="discount-btn discount-btn-clear pay-btn" id="payBtn">Оплата</button>
        <button type="button" class="discount-btn discount-btn-clear free-btn" id="freeBtn">Купити безкоштовно</button>
      </div>
    </footer>
  </div>

  <div class="pay-modal" id="payModal" hidden>
    <div class="pay-modal-card" role="dialog" aria-modal="true" aria-labelledby="payModalTitle">
      <button type="button" class="pay-modal-close" id="payCloseBtn" aria-label="Закрити">×</button>
      <img class="pay-modal-icon" id="payModalIcon" src="assets/icons/nfc.jpg" alt="" />
      <h2 class="pay-modal-title" id="payModalTitle">Оплата: 0 ₴</h2>
      <button type="button" class="pay-modal-done" id="payDoneBtn">Готово</button>
    </div>
  </div>

  <div class="pay-modal" id="phoneModal" hidden>
    <div class="pay-modal-card phone-modal-card" role="dialog" aria-modal="true" aria-labelledby="phoneModalTitle">
      <button type="button" class="pay-modal-close" id="phoneCloseBtn" aria-label="Закрити">×</button>
      <h2 class="pay-modal-title" id="phoneModalTitle">Номер телефону</h2>
      <div class="phone-display" id="phoneDisplay">+380-(</div>
      <div class="phone-keypad" id="phoneKeypad" aria-label="Клавіатура телефону">
        <button type="button" class="key" data-phone-key="1">1</button>
        <button type="button" class="key" data-phone-key="2">2</button>
        <button type="button" class="key" data-phone-key="3">3</button>
        <button type="button" class="key key-action" data-phone-key="clear">C</button>
        <button type="button" class="key" data-phone-key="4">4</button>
        <button type="button" class="key" data-phone-key="5">5</button>
        <button type="button" class="key" data-phone-key="6">6</button>
        <button type="button" class="key" data-phone-key="7">7</button>
        <button type="button" class="key" data-phone-key="8">8</button>
        <button type="button" class="key" data-phone-key="9">9</button>
        <button type="button" class="key key-action" data-phone-key="back">⌫</button>
        <button type="button" class="key" data-phone-key="0">0</button>
      </div>
      <button type="button" class="pay-modal-done" id="phoneDoneBtn">Готово</button>
    </div>
  </div>

  <script src="js/denominations.js?v=9"></script>
  <script src="js/banknote-assets.js?v=8"></script>
  <script src="js/rates-fallback.js?v=2"></script>
  <script src="js/rates.js?v=2"></script>
  <script src="js/breakdown.js?v=9"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
